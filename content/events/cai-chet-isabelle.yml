id: cai-chet-isabelle
type: event
name: Cái chết của Isabelle Le Gardien
universe: asarya
participants: [isabelle-le-gardien, leopold-frankia, edgard-karrel]
date: Năm 604
order: 604
summary: Leopold Frankia vô ý khiến Isabelle chết khi cố cưỡng đoạt nàng, rồi tiết lộ bí mật về Rickard và Isabelle cho Edgard.
tags: [Chưa chốt]
facts:
  Trạng thái: Động cơ tiết lộ bí mật chưa chốt
sections:
  - title: Diễn biến
    body: |
      [[leopold-frankia]] yêu [[isabelle-le-gardien]] theo kiểu chiếm hữu và dùng bí mật về [[rickard-azure-566]] để đe dọa nàng. Năm 604 hắn cố cưỡng đoạt nàng và vô ý khiến nàng chết, rồi còn có những hành vi tàn bạo, xâm hại. Đây là bạo lực, không phải tình yêu.

      Sau đó hắn tiết lộ cho [[edgard-karrel]] bí mật về quan hệ của Rickard và Isabelle, cùng sự thật về cái chết của [[ricktor-azure]]. Edgard nghi ngờ Rickard liên quan đến cái chết của vợ.
  - title: Hướng phát triển (chưa chốt)
    body: |
      Mục đích của Leopold khi tiết lộ bí mật, những thông tin chính xác đã tiết lộ, và vì sao Edgard nghi Rickard thay vì nhận ra mình bị thao túng chưa được xác định.
