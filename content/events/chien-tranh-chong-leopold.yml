id: chien-tranh-chong-leopold
type: event
name: Chiến tranh chống Leopold
universe: asarya
participants: [caster-karrel, martin-frankia, serena-frankia, leopold-frankia, lionel-avarre, edgard-karrel, ronald-yormont]
date: Năm 605–612
order: 605.2
summary: Cuộc chiến giữa phe kháng chiến Azureknight của Caster và Martin Frankia, phe Lionel–Edgard chống Giáo hội, và Leopold, trong khi Ronald Yormont đứng ngoài hưởng lợi.
sections:
  - title: Các phe
    body: |
      - **Leopold** và Giáo hội đương thời.
      - **[[lionel-avarre]] và [[edgard-karrel]]** chống Giáo hội và Leopold.
      - **[[caster-karrel]] và [[martin-frankia]]**: cùng [[serena-frankia]] rời hoàng đô, đến Azureknight, tôn Martin làm vua và kháng chiến chống Leopold.
      - **[[ronald-yormont]]** đứng ngoài, là ngư ông đắc lợi trong 605–607.
  - title: Diễn biến
    body: |
      Năm 607, Lionel và Edgard đánh bại giáo hoàng Richard II ([[edgard-tro-thanh-giao-hoang]]); Edgard liên kết Giáo hội với phe kháng chiến Azureknight. Edgard bị Leopold giết năm 609, Lionel làm giáo hoàng và rút khỏi chiến tranh. Cuộc chiến ngã ngũ ở [[tran-tu-chien-612]].
