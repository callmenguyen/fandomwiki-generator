id: cai-chet-caster
type: event
name: Cái chết của Caster Karrel
universe: asarya
participants: [caster-karrel, martin-frankia, lionel-avarre, ronald-yormont, merlin-azure, seraphine-azure]
date: Năm 613
order: 613
summary: Phe kháng chiến phản bội Caster và tiếp tục chiến tranh với Ronald Yormont, dẫn đến cái chết anh dũng của Caster khi Seraphine đang mang thai.
tags: [Chưa chốt]
facts:
  Trạng thái: Chi tiết phản bội cần đối chiếu
sections:
  - title: Diễn biến
    body: |
      Sau khi đánh bại Leopold, [[martin-frankia]] lo sợ ảnh hưởng của [[caster-karrel]]; phe kháng chiến phản bội Caster và tiếp tục cuộc chiến với [[ronald-yormont]]. [[lionel-avarre]] có vai trò trong sự kiện. Caster chết một cách anh dũng, khi vợ anh [[seraphine-azure]], mới cưới năm 613, đang mang thai.

      Cùng năm, [[merlin-azure]] phục vụ Ronald.
  - title: Hướng phát triển (chưa chốt)
    body: |
      Tài liệu cũ mô tả Martin đưa Caster vào chiến dịch bất lợi và cắt tiếp tế; phiên bản mới nhấn mạnh phe kháng chiến phản bội Caster sau chiến thắng 612. Cần chốt cách kết hợp hai mô tả, và nơi ở của Seraphine trong bối cảnh Ronald là kẻ thù.
