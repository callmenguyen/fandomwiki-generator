name: Edgard mất tay phải
universe: asarya
participants: [edgard-karrel]
date: Năm 575
order: 575
summary: Edgard Karrel lên năm bị một sinh vật liên quan đến bào tử Attila tấn công và mất bàn tay hoặc một phần cánh tay phải.
sections:
  - title: Diễn biến
    body: |
      Khi mới khoảng năm tuổi, [[edgard-karrel]] bị một sinh vật được tạo ra từ bào tử Attila tấn công. Anh mất bàn tay hoặc một phần cánh tay phải; mức độ chính xác chưa được xác định.

      Dù vậy, Edgard trở thành kiếm sĩ xuất sắc, chiến đấu bằng tay trái.
