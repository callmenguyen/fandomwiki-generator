summary: Cuộc đối đầu giữa Ricktor, Rickard và Isabelle dẫn đến cái chết ngoài ý muốn của Ricktor, bí mật mà Harold chứng kiến.
facts:
  Tính chất: Tai nạn
sections:
  - title: Diễn biến
    body: |
      [[ricktor-azure]] phát hiện quan hệ bí mật giữa [[rickard-azure-566]] và [[isabelle-le-gardien]]. Cuộc đối đầu kết thúc bằng cái chết ngoài ý muốn của Ricktor; Rickard và Isabelle không có kế hoạch giết ông. [[harold-azure]], khi đó 5 tuổi, chứng kiến và mất trí nhớ.
  - title: Hệ quả
    body: |
      Isabelle rời Azureknight về Dragonia và sinh [[julien]], công khai là con của Ricktor nhưng thực tế là con của Rickard. Bí mật này về sau bị [[leopold-frankia]] khai thác.
