sections:
  - title: Diễn biến
    body: |
      [[florian-youmitte]] cướp ngôi chú mình, [[filippe-youmitte]], với sự giúp đỡ của nhà Frankia, trong đó có [[dennis-frankia]]. Cùng năm, [[rickard-azure-531]] mất, khiến [[darian-azure]] nuôi ý định trả thù Florian.
