sections:
  - title: Tổng quan
    body: |
      Thảm họa xảy ra tại Eden dưới thời vua [[taira-faether]], cha của [[james-faether]]. Hậu duệ của ông về sau có vai trò trong việc bảo toàn Sein, tạo nên một nghịch lý lịch sử của gia tộc Faether.

      Chi tiết bản chất thảm họa chưa được tài liệu hiện có mô tả.
