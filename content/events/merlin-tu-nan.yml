summary: Merlin Azure nguyên bản chết do ngã từ vách đá; Đức Chúa đưa một phần bảy linh hồn Sein vào cơ thể cậu.
sections:
  - title: Diễn biến
    body: |
      [[merlin-azure]], sinh năm 592, chết do tai nạn ngã từ vách đá năm 596. Đức Chúa đưa một phần bảy linh hồn của Sein vào cơ thể đã chết. Merlin hiện tại vì thế có cơ thể là Merlin Azure nhưng linh hồn là một phần linh hồn Sein, và ban đầu không có ký ức về cuộc đời Sein.
