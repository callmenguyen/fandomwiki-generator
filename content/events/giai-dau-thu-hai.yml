id: giai-dau-thu-hai
type: event
name: Giải đấu thứ hai và hôn nhân Edgard–Isabelle
universe: asarya
participants: [edgard-karrel, isabelle-le-gardien]
date: Năm 590
order: 590
summary: Edgard Karrel thắng giải đấu thứ hai và kết hôn với Isabelle với điều kiện nàng không chung giường, điều kiện bị phá vỡ đầu năm 592.
tags: [Chưa chốt]
facts:
  Trạng thái: Lý do phá điều kiện chưa chốt
sections:
  - title: Diễn biến
    body: |
      [[edgard-karrel]] thắng giải đấu và cưới [[isabelle-le-gardien]]. Nàng đồng ý với điều kiện không bao giờ chung giường với anh, và Edgard chấp nhận. Giữa 590 và 592 có một tuyến tình cảm riêng giữa hai người; đầu năm 592 điều kiện bị phá vỡ. Hai người con đầu, [[edmin-karrel]] và [[rachelle-karrel]], sinh ngày 19/11/592.
  - title: Hướng phát triển (chưa chốt)
    body: |
      Lý do lãng mạn khiến điều kiện bị phá vỡ đầu năm 592 chưa được viết.
