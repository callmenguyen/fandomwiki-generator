id: tran-tu-chien-612
type: event
name: Trận tử chiến giữa Caster và Leopold
universe: asarya
participants: [caster-karrel, leopold-frankia, lionel-avarre, martin-frankia]
date: Đầu năm 612
order: 612
summary: Caster mắc mưu Leopold khi chiến thuật mũi nêm bị bắt bài; Lionel Avarre đem quân đến cứu và đánh bại Leopold phút chót.
sections:
  - title: Diễn biến
    body: |
      [[caster-karrel]], tướng kỵ binh quen dùng chiến thuật mũi nêm xuyên đội hình địch, bị [[leopold-frankia]] bắt bài. Khi thế cục sắp ngả ngũ, [[lionel-avarre]], dù đã tuyên bố rút khỏi chiến tranh, bất ngờ đem quân Avarre đến và đánh bại Leopold. Kháng chiến thành công; [[martin-frankia]] lên ngôi, chưa đầy một tháng sau đó [[ronald-yormont]] tuyên chiến.
