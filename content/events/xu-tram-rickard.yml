id: xu-tram-rickard
type: event
name: Rickard Azure bị xử trảm
universe: asarya
participants: [rickard-azure-566, leopold-frankia, edgard-karrel, cedric-azure, lionel-avarre]
related: [merlin-azure]
date: Năm 605
order: 605.1
summary: Leopold ra lệnh xử trảm Rickard thay cho Merlin; Edgard không ngăn cản, rồi bị Cedric đâm bị thương và được Lionel cứu.
sections:
  - title: Diễn biến
    body: |
      Sau khi [[merlin-azure]] giết Henry và trốn thoát, [[rickard-azure-566]] và [[cedric-azure]] là hai người Azure còn lại ở hoàng đô. [[leopold-frankia]] ra lệnh xử trảm Rickard thay cho Merlin. [[edgard-karrel]], vốn mâu thuẫn với Rickard và nghi anh liên quan đến cái chết của Isabelle, không ngăn cản.

      Edgard sau đó bí mật đưa Cedric rời hoàng đô, nhưng Cedric tức giận vì nghĩ Edgard can thiệp khiến cha chết và dùng kiếm đâm bị thương Edgard. [[lionel-avarre]] cứu Edgard đưa về Avarre.
