summary: James Faether phong ấn và đóng băng cơ thể gốc của Sein khoảng 500 năm, một phần kế hoạch dài hạn của Đức Chúa.
tags: [Chưa chốt]
facts:
  Trạng thái: Có phần chưa chốt
sections:
  - title: Diễn biến
    body: |
      Đức Chúa muốn Sein sống sót và có hậu duệ để người Merseide có cơ hội tồn tại trở lại. Đức Chúa không trực tiếp phong ấn Sein; [[james-faether]] là người thực hiện.

      Cơ thể gốc của Sein bị phong ấn và đóng băng khoảng 500 năm.
  - title: Hướng phát triển (chưa chốt)
    body: |
      - Vì sao Đức Chúa không trực tiếp tiêu diệt Attila hay các bào tử.
      - Làm thế nào [[merlin-azure]] có thể phá phong ấn mà không giải phóng Attila.
