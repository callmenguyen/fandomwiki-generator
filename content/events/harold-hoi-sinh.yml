summary: Harold bị đầu độc, phát điên rồi bị Edgard bắn chết; Merlin và Rachelle tìm Arthur để hồi sinh anh.
tags: [Chưa chốt]
facts:
  Trạng thái: Có phần chưa chốt
sections:
  - title: Diễn biến
    body: |
      Một quan chức kinh tế bất mãn với [[edgard-karrel]] đầu độc [[harold-azure]]. Harold phát điên trong cuộc đấu với [[caster-karrel]] và bị Edgard bắn chết. [[merlin-azure]] và Rachelle tìm đến pháp sư [[arthur]]; Harold được hồi sinh, phục hồi ký ức về cái chết của Ricktor nhưng giữ kín sự thật.
  - title: Hướng phát triển (chưa chốt)
    body: |
      Theo hướng đang phát triển, Arthur không đưa linh hồn Harold trở lại mà thay bằng một mảnh linh hồn Sein, có thể liên quan đến [[james-faether]]. Danh tính và ký ức của người sống trong cơ thể Harold sau nghi thức chưa được xác định.
