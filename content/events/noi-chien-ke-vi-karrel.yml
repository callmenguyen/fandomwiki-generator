id: noi-chien-ke-vi-karrel
type: event
name: Nội chiến kế vị nhà Karrel
universe: asarya
participants: [edward-karrel, martin-karrel-538, dennis-frankia]
related: [edwin-karrel]
date: Năm 569–585
order: 569
summary: Cuộc nội chiến kéo dài 16 năm sau khi Edwin Karrel mất mà không chọn người kế vị, kết thúc với chiến thắng của Edward Karrel.
sections:
  - title: Diễn biến
    body: |
      [[edwin-karrel]] qua đời năm 569 mà không chọn người kế vị mới, vì người kế vị được chọn là [[martel-karrel]] đã mất trước. Azureknight rơi vào nội loạn và trở thành thời kỳ đen tối, không có lãnh chúa tối cao.

      Năm 585, [[edward-karrel]] chiến thắng nhờ sự giúp đỡ của [[dennis-frankia]]. [[martin-karrel-538]] mất trong thời gian này, năm 581.
