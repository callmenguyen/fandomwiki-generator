summary: Lionel và Edgard đánh bại giáo hoàng Richard II; Edgard trở thành giáo hoàng và liên kết Giáo hội với phe kháng chiến Azureknight.
sections:
  - title: Diễn biến
    body: |
      [[lionel-avarre]] và [[edgard-karrel]] đánh bại giáo hoàng Richard II. Edgard trở thành giáo hoàng mới, giữ chức đến khi bị giết năm 609, và liên kết Giáo hội với phe kháng chiến Azureknight để chống [[leopold-frankia]]. Sau đó Lionel kế nhiệm.
