sections:
  - title: Tiểu sử
    body: |
      Ricktor là em trai của [[rickard-azure-566]], được xem là một trong những chiến binh xuất sắc nhất Azureknight. Năm 586, ở tuổi 15, anh thắng giải đấu đầu tiên và đánh bại [[edgard-karrel]] để giành quyền kết hôn với [[isabelle-le-gardien]] ([[giai-dau-dau-tien]]).

      Năm 589, anh phát hiện quan hệ giữa Rickard và Isabelle. Anh chết trong cuộc đối đầu sau đó, một tai nạn chứ không phải vụ giết người có kế hoạch ([[cai-chet-ricktor-azure]]). [[harold-azure]] chứng kiến sự việc.
  - title: Julien
    body: |
      [[julien]], sinh sau khi anh mất, được công khai là con của Ricktor nhưng thực tế là con của Rickard.
