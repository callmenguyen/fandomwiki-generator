id: dennis-frankia
type: character
name: Dennis Frankia
universe: asarya
summary: Hoàng đế từ 581 đến 603, cha của Sebastian, Theresa và Leopold; từng hỗ trợ Florian rồi cùng Darian Azure lật đổ ông.
tags: [Gia tộc Frankia, Hoàng đế]
facts:
  Sinh: 541
  Mất: 603
  Trị vì: 581–603
  Gia tộc: Frankia
related: [sebastian-frankia, theresa-frankia, leopold-frankia, florian-youmitte, darian-azure, edward-karrel, nemo, florian-cuop-ngoi, lat-do-florian, noi-chien-ke-vi-karrel]
sections:
  - title: Tiểu sử
    body: |
      Dennis từng giúp [[florian-youmitte]] chiếm ngôi ([[florian-cuop-ngoi]]) nhưng đến năm 581 liên minh với [[darian-azure]] để lật đổ ông ([[lat-do-florian]]) và trở thành hoàng đế, ổn định đế quốc sau khi Youmitte sụp đổ. Ông giúp [[edward-karrel]] thắng [[noi-chien-ke-vi-karrel]] năm 585. [[nemo]] có ảnh hưởng như một tể tướng không chính thức dưới thời ông.
  - title: Gia đình
    body: |
      Dennis có ba người con: [[sebastian-frankia]], [[theresa-frankia]] và [[leopold-frankia]]. Cháu nội ông gồm [[henry-frankia]], [[serena-frankia]] và [[martin-frankia]]; cháu ngoại là [[caster-karrel]]. Henry kế vị năm 603.
