  - title: Tiểu sử
    body: |
      Florian cướp ngôi người chú [[filippe-youmitte]] năm 566 ([[florian-cuop-ngoi]]) và tiến hành tàn sát một nhánh hoàng tộc. Năm 581, [[dennis-frankia]] cùng [[darian-azure]] lật đổ ông ([[lat-do-florian]]), kết thúc triều đại Youmitte (bắt đầu năm 521). Trong thứ bậc trí tuệ chính trị, ông đứng cuối.
