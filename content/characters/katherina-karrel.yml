sections:
  - title: Tiểu sử
    body: |
      Katherina là con của [[martin-karrel-538]] và kết hôn với [[sebastian-frankia]]; các con là [[henry-frankia]], [[serena-frankia]] và [[martin-frankia]].

      Sau khi [[darian-azure]] từ chối, bà chọn [[rickard-azure-566]] làm tể tướng chính thức cho Henry, trao cho anh vị trí mà [[edgard-karrel]] đã điều hành trên thực tế trong nhiều năm.
