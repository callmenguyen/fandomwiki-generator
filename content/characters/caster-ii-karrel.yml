sections:
  - title: Tiểu sử
    body: |
      Caster II sinh sau cái chết của [[caster-karrel]] và lên nắm quyền với sự giúp đỡ của [[merlin-azure]]. Cuối cùng anh phản bội Merlin, một bi kịch quan trọng của tuyến truyện vì Merlin từng ngưỡng mộ cha anh.
  - title: Hướng phát triển (chưa chốt)
    body: |
      Động cơ cụ thể khiến Caster II phản bội Merlin chưa được xác định.
