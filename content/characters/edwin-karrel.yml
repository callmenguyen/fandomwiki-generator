sections:
  - title: Tiểu sử
    body: |
      Edwin là con duy nhất của [[martel-avarre]]. Ông sáng lập Karrel năm 526 và cai trị Azureknight từ 539. Con trưởng của ông, [[martel-karrel]] (519–555), mất trước ông; [[martin-karrel-538]] cũng là con ông.

      Edwin không chọn người kế vị mới, khiến nhà Karrel rơi vào [[noi-chien-ke-vi-karrel]] từ 569 đến 585. [[darian-azure]] tôn trọng ông và tiếp tục các chính sách của ông. Trong thứ bậc trí tuệ chính trị, Edwin đứng đầu.
