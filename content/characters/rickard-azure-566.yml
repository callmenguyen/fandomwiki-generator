id: rickard-azure-566
type: character
name: Rickard Azure (sinh 566)
universe: asarya
aliases: [Rickard Azure]
summary: Con trưởng của Darian, chính trị gia xuất sắc và người kế thừa kỳ vọng của nhà Azure; bí mật yêu Isabelle Le Gardien và bị Leopold xử trảm năm 605.
tags: [Gia tộc Azure, Tể tướng]
facts:
  Sinh: 566
  Mất: 605
  Chức vị: Tể tướng chính thức dưới triều Henry Frankia
  Gia tộc: Azure
related: [darian-azure, ricktor-azure, isabelle-le-gardien, helen-lyceria, edgard-karrel, leopold-frankia, andreas-azure, cedric-azure, julien, merlin-azure, cai-chet-ricktor-azure, xu-tram-rickard]
sections:
  - title: Tiểu sử
    body: |
      Rickard là con trưởng của [[darian-azure]], có khả năng đối đầu với [[edward-karrel]] và được Darian xem là người thích hợp nhất để kế thừa. Năm 580, khi 14 tuổi, anh được sắp xếp kết hôn với [[emmaelle-le-gardien]] và đến Dragonia, nơi anh gặp [[isabelle-le-gardien]] và yêu nàng. Emmaelle bỏ trốn nên cuộc liên hôn thất bại.

      Anh kết hôn với [[helen-lyceria]] nhưng vẫn giữ quan hệ bí mật với Isabelle. Hai con trai chính thức của anh là [[andreas-azure]] (587) và [[cedric-azure]] (589); [[julien]] (589) là con ngoài hôn nhân với Isabelle.
  - title: Cái chết của Ricktor
    body: |
      Năm 589, [[ricktor-azure]] phát hiện quan hệ này và cuộc đối đầu giữa ba người dẫn đến cái chết ngoài ý muốn của Ricktor ([[cai-chet-ricktor-azure]]). Rickard giấu kín sự thật để bảo vệ gia đình.
  - title: Mâu thuẫn với Edgard và cái chết
    body: |
      Katherina chọn Rickard làm tể tướng chính thức cho Henry sau khi Darian từ chối, trong khi [[edgard-karrel]] đã điều hành triều đình trên thực tế nhiều năm. Mâu thuẫn tích lũy qua nhiều năm; năm 605, sau khi [[merlin-azure]] giết Henry, [[leopold-frankia]] ra lệnh xử trảm Rickard thay cho Merlin, còn Edgard không ngăn cản ([[xu-tram-rickard]]).
