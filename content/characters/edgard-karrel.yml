id: edgard-karrel
type: character
name: Edgard Karrel
universe: asarya
summary: Kiếm sĩ tay trái, chính trị gia và nhà kinh tế điều hành triều đình trên thực tế, đối thủ của Rickard Azure, chồng Isabelle, giáo hoàng 607–609 và bị Leopold giết năm 609.
tags: [Gia tộc Karrel, Giáo hoàng, Chưa chốt]
facts:
  Sinh: 570
  Mất: 609
  Gia tộc: Karrel
  Giáo hoàng: 607–609
  Trạng thái: Nguyên nhân cái chết chưa chốt
related: [martin-karrel-538, edward-karrel, katherina-karrel, nemo, theresa-frankia, isabelle-le-gardien, caster-karrel, rickard-azure-566, harold-azure, leopold-frankia, lionel-avarre, cedric-azure, attila-tan-cong-edgard, giai-dau-dau-tien, giai-dau-thu-hai, xu-tram-rickard, edgard-tro-thanh-giao-hoang]
sections:
  - title: Tiểu sử
    body: |
      Edgard là con của [[martin-karrel-538]] và học trò được [[nemo]] yêu quý. Năm 575 anh mất bàn tay hoặc một phần cánh tay phải ([[attila-tan-cong-edgard]]) nhưng trở thành kiếm sĩ xuất sắc dùng tay trái. Nemo từng tiếc vì tài năng học thuật của anh bị cuốn vào chính trị.

      Anh là chính trị gia, nhà kinh tế và người điều hành quyền lực trên thực tế tại triều đình, tuy không giữ chức tể tướng chính thức. Ảnh hưởng của anh trải rộng trên chính trị triều đình, kinh tế thương mại, quan hệ với Giáo hội và việc đào tạo [[caster-karrel]]. Việc anh làm suy yếu viên quan phụ trách kinh tế khiến người này bất mãn và góp phần dẫn đến việc [[harold-azure]] bị đầu độc.
  - title: Hôn nhân
    body: |
      Năm 587 anh kết hôn với [[theresa-frankia]], người mất khi sinh [[caster-karrel]]. Năm 586 anh thua [[ricktor-azure]] trong giải đấu giành [[isabelle-le-gardien]], rồi thắng giải đấu thứ hai năm 590 và cưới nàng ([[giai-dau-thu-hai]]). Họ có bốn người con: [[edmin-karrel]], [[rachelle-karrel]], [[marielle-karrel]], [[martin-karrel-596]].
  - title: Mối thù với Rickard Azure
    body: |
      Mối thù tích lũy qua nhiều năm: việc Katherina chọn [[rickard-azure-566]] làm tể tướng, cái chết của Harold năm 603 khi Edgard bắn anh, và sau cái chết của Isabelle năm 604, việc [[leopold-frankia]] tiết lộ bí mật về Rickard và Isabelle khiến Edgard nghi ngờ Rickard. Năm 605 anh không ngăn cản việc Rickard bị xử trảm, rồi bí mật đưa [[cedric-azure]] đi và bị Cedric đâm bị thương ([[xu-tram-rickard]]).
  - title: Giáo hoàng
    body: |
      [[lionel-avarre]] cứu anh và đưa về Avarre. Hai người dựng lực lượng chống Giáo hội và Leopold. Năm 607, họ đánh bại giáo hoàng Richard II, Edgard trở thành giáo hoàng đến khi bị giết năm 609, liên kết Giáo hội với phe kháng chiến Azureknight ([[edgard-tro-thanh-giao-hoang]]).
  - title: Hướng phát triển (chưa chốt)
    body: |
      Nguyên nhân Leopold giết Edgard năm 609 chưa được xác định.
