sections:
  - title: Tiểu sử
    body: |
      Cedric là con của [[rickard-azure-566]] và [[helen-lyceria]]. Năm 605, anh và cha là hai người Azure còn lại ở hoàng đô. Khi [[edgard-karrel]] bí mật đưa anh rời hoàng đô sau cái chết của Rickard, Cedric tức giận và dùng kiếm đâm bị thương Edgard ([[xu-tram-rickard]]).
