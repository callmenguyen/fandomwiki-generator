id: harold-azure
type: character
name: Harold Azure
universe: asarya
summary: Con thứ tư của Darian, chứng kiến cái chết của Ricktor, bị đầu độc và chết năm 603, được Arthur hồi sinh và trở thành nhà mưu lược chính trị xuất sắc.
tags: [Gia tộc Azure, Mưu lược, Chưa chốt]
facts:
  Sinh: 584
  Mất lần một: 603
  Mất lần hai: 609
  Gia tộc: Azure
  Trạng thái: Có phần chưa chốt
related: [darian-azure, ricktor-azure, arthur, edgard-karrel, caster-karrel, merlin-azure, harold-hoi-sinh]
sections:
  - title: Tiểu sử
    body: |
      Harold là con thứ tư của [[darian-azure]], và là con trai thứ ba vì trước anh còn có chị gái [[elarina-azure]]. Năm 589, ở tuổi 5, anh chứng kiến cái chết của anh trai [[ricktor-azure]], bị tổn thương tâm lý và mất trí nhớ, khiến sự thật bị chôn giấu.

      Năm 603, một quan chức kinh tế bất mãn với [[edgard-karrel]] đầu độc Harold. Anh phát điên trong cuộc đấu với [[caster-karrel]] và bị Edgard bắn chết. [[merlin-azure]] và Rachelle tìm đến [[arthur]] để hồi sinh anh ([[harold-hoi-sinh]]).

      Sau khi hồi sinh, Harold trở thành nhà mưu lược chính trị xuất sắc, được đánh giá vượt Caster về thao túng chính trị. Anh chết lần thứ hai năm 609; nguyên nhân chưa được xác định.
  - title: Hướng phát triển (chưa chốt)
    body: |
      Arthur có thể đã thay linh hồn Harold bằng một mảnh linh hồn của Sein thay vì trả linh hồn Harold về. Các câu hỏi còn mở:

      - Harold sau hồi sinh có còn ký ức và tính cách cũ không.
      - Mảnh linh hồn đó có phải một trong bảy mảnh Merlin cần thu hồi không (nó không phải bào tử Attila).
      - Điều gì xảy ra với mảnh linh hồn khi Harold chết năm 609.
      - Vì sao việc hồi sinh Harold không mở ra khả năng hồi sinh Rickard, Edgard hay Caster.
