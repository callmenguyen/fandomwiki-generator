id: isabelle-le-gardien
type: character
name: Isabelle Le Gardien
universe: asarya
summary: Người đẹp nhất thế giới năm 590, người yêu bí mật của Rickard Azure, vợ của Edgard Karrel; chết năm 604 khi Leopold cố cưỡng đoạt nàng.
tags: [Gia tộc Le Gardien]
facts:
  Sinh: 571
  Mất: 604
  Gia tộc: Le Gardien
  Chồng: Edgard Karrel
related: [roland-le-gardien, rachelle-le-gardien, rickard-azure-566, ricktor-azure, julien, edgard-karrel, leopold-frankia, giai-dau-dau-tien, cai-chet-ricktor-azure, giai-dau-thu-hai, cai-chet-isabelle]
sections:
  - title: Tiểu sử
    body: |
      Isabelle là em song sinh của [[rachelle-le-gardien]]. Khi còn nhỏ nàng khá giống chị, nhưng chủ động xây dựng hình tượng đối lập: ít nói hơn, ít thể hiện sự ham học và thiên về lý tưởng hiệp sĩ.

      Năm 580 nàng gặp [[rickard-azure-566]] và yêu anh. Năm 586, [[ricktor-azure]] đánh bại [[edgard-karrel]] để giành quyền kết hôn với nàng ([[giai-dau-dau-tien]]). Sau cái chết của Ricktor năm 589, nàng về Dragonia, nơi nàng sinh [[julien]] — công khai là con của Ricktor nhưng thực tế là con của Rickard ([[cai-chet-ricktor-azure]]).
  - title: Hôn nhân với Edgard
    body: |
      Năm 590, Edgard thắng giải đấu thứ hai và cưới nàng ([[giai-dau-thu-hai]]). Nàng đồng ý với điều kiện không bao giờ chung giường với anh, và Edgard chấp nhận. Giữa 590 và 592 có một tuyến tình cảm riêng giữa hai người; đầu năm 592 điều kiện bị phá vỡ vì một lý do lãng mạn (chi tiết chưa viết).

      Bốn người con của Isabelle và Edgard là [[edmin-karrel]] và [[rachelle-karrel]] (sinh ngày 19/11/592), [[marielle-karrel]] (594) và [[martin-karrel-596]].
  - title: Cái chết
    body: |
      [[leopold-frankia]] yêu nàng theo kiểu chiếm hữu, dùng bí mật về Rickard để đe dọa nàng. Năm 604, hắn cố cưỡng đoạt nàng và vô ý khiến nàng chết, rồi còn có những hành vi tàn bạo, xâm hại. Đây là bạo lực, không phải tình yêu ([[cai-chet-isabelle]]).
