sections:
  - title: Tiểu sử
    body: |
      Edward là con của [[martin-karrel-538]], được xem là một trong những chính trị gia thao túng giỏi nhất Asarya. Ông chiến thắng [[noi-chien-ke-vi-karrel]] năm 585 nhờ [[dennis-frankia]]. Ông còn sống sau cái chết của [[edgard-karrel]] năm 609, nên nhà Karrel không nhất thiết suy yếu ngay khi Edgard qua đời. Con trai ông là [[martin-karrel-583]].
