id: martin-frankia
type: character
name: Martin Frankia
universe: asarya
summary: Em của Henry Frankia, được Caster tôn lên làm vua kháng chiến chống Leopold, lên ngôi hoàng đế năm 612 và bị cho là phản bội Caster; không phải Martin Karrel.
tags: [Gia tộc Frankia, Hoàng đế]
facts:
  Sinh: 592
  Gia tộc: Frankia
  Lên ngôi: 612
related: [sebastian-frankia, katherina-karrel, henry-frankia, serena-frankia, caster-karrel, lionel-avarre, ronald-yormont, leopold-frankia, chien-tranh-chong-leopold, cai-chet-caster]
sections:
  - title: Tiểu sử
    body: |
      Martin là con của [[sebastian-frankia]] và [[katherina-karrel]]. Năm 605 ông cùng [[caster-karrel]] và [[serena-frankia]] rời hoàng đô đến Azureknight, nơi ông được tôn làm vua để kháng chiến chống [[leopold-frankia]]. Chưa đầy một tháng sau khi lên ngôi chính thức năm 612, [[ronald-yormont]] tuyên chiến.

      Ông lo sợ ảnh hưởng của Caster và cùng phe kháng chiến phản bội anh, dẫn đến [[cai-chet-caster]]. Ông được [[lionel-avarre]] ủng hộ. Cần phân biệt ông với [[martin-karrel-538]], [[martin-karrel-583]], [[martin-karrel-596]].
