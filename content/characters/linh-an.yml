summary: Người học việc tại kho lưu trữ Vân Cảng, có khả năng nghe thấy ký ức trong pha lê và là nhân vật trung tâm của Người Giữ Ánh Sáng.
tags: [Nhân vật chính, Người bảo hộ]
facts:
  Tuổi: 19
  Quê quán: Vân Cảng
