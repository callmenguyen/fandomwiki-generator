sections:
  - title: Tiểu sử
    body: |
      Garred có năng lực quân sự vừa phải nhưng không phải chiến lược gia xuất sắc. Ông bí mật căm ghét [[darian-azure]] nhưng bên ngoài vẫn phục tùng. Ông kết hôn với [[jennielle-le-gardien]] để duy trì liên minh Azure–Le Gardien sau khi [[emmaelle-le-gardien]] bỏ trốn; hai người không có con.
