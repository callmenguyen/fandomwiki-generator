summary: Con gái của Edgard Karrel và Isabelle Le Gardien, sinh ngày 19/11/592; không phải Rachelle Le Gardien.
tags: [Gia tộc Karrel, Chưa chốt]
facts:
  Sinh: 19/11/592
  Gia tộc: Karrel
  Trạng thái: Vai trò năm 603 chưa chốt
