sections:
  - title: Gia đình
    body: |
      Rachelle là con của [[edgard-karrel]] và [[isabelle-le-gardien]], sinh cùng ngày với [[edmin-karrel]]. Cần phân biệt với [[rachelle-le-gardien]], chị gái Isabelle.
  - title: Hướng phát triển (chưa chốt)
    body: |
      Tài liệu nói "Rachelle" cùng Merlin tìm đến Arthur năm 603 ([[harold-hoi-sinh]]); vì Rachelle Le Gardien đã mất năm 585, đây được hiểu tạm là Rachelle Karrel (khi đó 11 tuổi), chưa được xác nhận.
