id: ronald-yormont
type: character
name: Ronald Yormont
universe: asarya
summary: Lãnh chúa quân sự vùng Nordic, hưởng lợi từ cuộc chiến 605–607, tuyên chiến với Martin Frankia năm 612; Merlin phục vụ ông năm 613.
tags: [Gia tộc Yormont]
facts:
  Gia tộc: Yormont
  Vùng đóng quân: Nordic
related: [florence-yormont, merlin-azure, seraphine-azure, caster-karrel, martin-frankia, lionel-avarre, cai-chet-caster]
sections:
  - title: Tiểu sử
    body: |
      Ronald là anh của [[florence-yormont]] và đóng quân ở Nordic, nơi [[merlin-azure]] đưa [[seraphine-azure]] đến năm 605. Trong 605–607 ông là "ngư ông đắc lợi" giữa các phe. Sau khi [[martin-frankia]] lên ngôi năm 612, ông tuyên chiến.

      Năm 613 Merlin phục vụ ông; việc Merlin ca ngợi [[caster-karrel]] như hình mẫu hoàng đế lý tưởng vô tình khơi dậy sự ghen tị của ông. Ông có vai trò trong chiến dịch dẫn đến [[cai-chet-caster]]. Trong thứ bậc trí tuệ chính trị, ông đứng ngay sau [[lionel-avarre]].
