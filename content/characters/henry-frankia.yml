sections:
  - title: Tiểu sử
    body: |
      Henry là con của [[sebastian-frankia]] và [[katherina-karrel]], cháu nội [[dennis-frankia]]. Ông lên ngôi năm 603 khi đã có vợ. Ông cưỡng bức và giam giữ [[seraphine-azure]], dẫn đến việc bị [[merlin-azure]] và [[florence-yormont]] giết năm 605 ([[henry-bi-sat-hai]]).
  - title: Hướng phát triển (chưa chốt)
    body: |
      Tính cách cuối cùng của Henry chưa xác nhận: một bạo chúa ham hưởng thụ và ngu xuẩn, hay kẻ xảo quyệt trong âm mưu ngắn hạn nhưng thiếu tầm nhìn dài hạn.
