  - title: Tiểu sử
    body: |
      Martin là con của [[edwin-karrel]], cha của [[edward-karrel]], [[katherina-karrel]] và [[edgard-karrel]]. Ông đóng vai trò quan trọng trong truyền thống quân sự nhà Karrel; [[doran]] từng là môn đồ của ông. Ông là bạn của [[nemo]]. Ông mất năm 581.
