sections:
  - title: Tiểu sử
    body: |
      Nemo là bạn của [[martin-karrel-538]], có ảnh hưởng lớn đến triều đình của [[dennis-frankia]] dù không giữ chức tể tướng chính thức. Ông dạy [[edgard-karrel]] và [[rachelle-le-gardien]], rồi đào tạo [[caster-karrel]], người mà ông âm thầm tin có thể trở thành hoàng đế. Ông tiếc nuối khi Edgard chuyển hướng tài năng sang chính trị. Trong thứ bậc trí tuệ chính trị, ông đứng ngay sau [[edwin-karrel]].
